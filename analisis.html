<!DOCTYPE html><html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BCIP · Fill Rate & Abastecimiento</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<style>
:root{--navy:#0D2A6D;--navy2:#071B47;--blue:#21299D;--sky:#4699EF;--red:#E00206;--guinda:#A60A1B;
--tint:#EEF3FB;--ink:#27314F;--gray:#6B7280;--ok:#1E8E3E;--dor:#B97E0B;--bord:#DDE5F2;--sb:232px}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',Arial,sans-serif;background:#F4F7FC;color:var(--ink);font-size:14px}
.bebas{font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;letter-spacing:1px}
a{color:inherit;text-decoration:none}
.sidebar{position:fixed;left:0;top:0;bottom:0;width:var(--sb);background:linear-gradient(180deg,var(--navy),var(--navy2));color:#fff;padding:22px 14px;display:flex;flex-direction:column;z-index:50}
.sb-logo{width:150px;margin:2px auto 24px;display:block}
.nav{display:flex;flex-direction:column;gap:4px}
.nav a{display:flex;align-items:center;gap:12px;padding:11px 14px;border-radius:10px;font-weight:700;font-size:13.5px;color:#B9C6E8;transition:all .15s}
.nav a:hover{background:rgba(255,255,255,.08);color:#fff}
.nav a.on{background:var(--red);color:#fff;box-shadow:0 4px 12px rgba(224,2,6,.35)}
.sb-foot{margin-top:auto;font-size:10.5px;color:#8FA3CF;line-height:1.5}
.sb-kbd{display:flex;align-items:center;gap:8px;background:rgba(255,255,255,.08);border-radius:9px;padding:9px 12px;margin-bottom:14px;cursor:pointer;font-size:12px;color:#B9C6E8}
.sb-kbd kbd{background:rgba(255,255,255,.15);border-radius:4px;padding:1px 6px;font-size:10.5px}
.main{margin-left:var(--sb);padding:22px 26px;max-width:1260px}
.topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.crumb{font-size:12px;color:var(--gray);font-weight:700}.crumb a{color:var(--sky)}
.page-title{font-size:34px;color:var(--navy);line-height:1;margin-top:3px}
.badge-act{font-size:11px;color:var(--gray);text-align:right}.badge-act b{display:block;color:var(--navy);font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{border-radius:14px;padding:15px 20px;color:#fff;transition:transform .15s}
.kpi:hover{transform:translateY(-2px)}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:1.6px;text-transform:uppercase;opacity:.85}
.kpi .v{font-size:31px;margin-top:5px}.kpi .s{font-size:11px;opacity:.75;margin-top:2px}
.k1{background:var(--navy)}.k2{background:var(--blue)}.k3{background:var(--navy2)}.k4{background:var(--red)}
.kW{background:#fff;color:var(--ink);border:1.5px solid var(--bord)}
.kW .l{color:var(--gray)}.kW .v{color:var(--navy)}.kW .s{color:var(--gray)}
.card{background:#fff;border-radius:14px;padding:18px 20px;margin-bottom:16px;box-shadow:0 1px 3px rgba(13,42,109,.07);animation:up .25s ease}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.card-hd{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;flex-wrap:wrap;gap:8px}
.sec{font-size:21px;color:var(--navy);text-transform:uppercase}
.hint{font-size:11.5px;color:var(--gray)}
.btn{background:var(--tint);border:none;border-radius:8px;padding:7px 13px;font-weight:800;font-size:11px;color:var(--navy);cursor:pointer;font-family:inherit}
.btn:hover{background:#DFE9F8}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{padding:6px 13px;border-radius:16px;border:1.5px solid var(--bord);background:#fff;font-weight:800;font-size:11px;color:var(--gray);cursor:pointer;white-space:nowrap;transition:all .12s}
.chip:hover{border-color:var(--navy);color:var(--navy)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.dia.on{background:var(--red);border-color:var(--red)}
select{padding:7px 10px;border:1.5px solid var(--bord);border-radius:8px;font-family:inherit;font-weight:700;font-size:12px;color:var(--navy)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th{background:var(--navy);color:#fff;padding:9px 10px;text-align:right;font-size:10.5px;letter-spacing:.5px;cursor:pointer;user-select:none}
th:first-child,th.l{text-align:left;padding-left:12px}
th .arr{opacity:.5;font-size:9px}
td{padding:8px 10px;text-align:right;border-bottom:1px solid #E4EBF5;font-variant-numeric:tabular-nums}
td:first-child,td.l{text-align:left;font-weight:700;color:var(--navy);padding-left:12px}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{background:var(--tint)!important}
tr:nth-child(even) td{background:#F9FBFE}
.fOK{color:var(--ok);font-weight:800}.fMED{color:var(--dor);font-weight:800}.fBAD{color:var(--guinda);font-weight:800}
.pill{display:inline-block;min-width:64px;padding:3px 10px;border-radius:12px;font-weight:800;font-size:10.5px;text-align:center}
.pOK{background:#E3F4E8;color:var(--ok)}.pMED{background:#FBF0D8;color:var(--dor)}.pBAD{background:#FBE7E8;color:var(--guinda)}
.bar{height:7px;background:#EDF1F8;border-radius:4px;overflow:hidden;min-width:70px;display:inline-block;vertical-align:middle;width:100%}
.bar i{display:block;height:100%;border-radius:4px;transition:width .4s ease}
.grid2{display:grid;grid-template-columns:1.05fr .95fr;gap:16px}
.hm td{padding:6px 8px;text-align:center;font-weight:800;font-size:11px;border:2px solid #fff;border-radius:6px}
.hm td:first-child{text-align:left!important;padding-left:12px}
.faltrow td{background:#FBF2F2!important;font-size:11.5px}
.faltrow td:first-child{font-weight:600;color:var(--guinda);padding-left:32px}
.okrow td{background:#F3FAF5!important;font-size:11.5px}
.okrow td:first-child{font-weight:600;color:var(--ok);padding-left:32px}
.spark{vertical-align:middle}
.empty{text-align:center;color:#9AA3B5;padding:22px;font-style:italic}
.backlink{display:inline-flex;gap:6px;font-size:12px;font-weight:800;color:var(--sky);cursor:pointer;margin-bottom:6px}
.blocks{display:flex;height:34px;border-radius:9px;overflow:hidden;margin:8px 0 4px}
.blocks div{display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:10.5px;white-space:nowrap;overflow:hidden}
.daybars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:8px}
.daybar{background:var(--navy);border-radius:6px 6px 0 0;position:relative;min-height:4px}
.daybar span{position:absolute;top:-18px;left:0;right:0;text-align:center;font-size:10.5px;font-weight:800;color:var(--navy)}
.daylbl{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;text-align:center;font-size:10.5px;font-weight:800;color:var(--gray);margin-top:4px}
.grpcard{border:2px solid var(--navy);border-radius:14px;overflow:hidden;margin-bottom:16px}
.grphd{background:var(--navy);color:#fff;padding:12px 18px;display:flex;justify-content:space-between;align-items:center;cursor:pointer}
#pal{position:fixed;inset:0;background:rgba(7,27,71,.55);backdrop-filter:blur(3px);display:none;z-index:100;align-items:flex-start;justify-content:center;padding-top:12vh}
#pal.show{display:flex}
.pal-box{width:640px;max-width:92vw;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 24px 70px rgba(7,27,71,.45)}
.pal-box input{width:100%;border:none;outline:none;padding:18px 22px;font-size:16px;font-family:inherit;font-weight:600;border-bottom:1px solid var(--bord)}
.pal-list{max-height:46vh;overflow-y:auto}
.pal-it{display:flex;justify-content:space-between;align-items:center;padding:11px 22px;cursor:pointer;font-weight:700;font-size:13.5px}
.pal-it .t{font-size:10px;font-weight:800;letter-spacing:1px;color:#fff;border-radius:5px;padding:2px 8px}
.pal-it:hover,.pal-it.sel{background:var(--tint)}
.t-prod{background:var(--red)}.t-cli{background:var(--navy)}.t-tie{background:var(--blue)}.t-pag{background:var(--gray)}
.pal-foot{padding:9px 22px;font-size:10.5px;color:var(--gray);border-top:1px solid var(--bord)}
@media(max-width:920px){:root{--sb:0px}.sidebar{display:none}.main{padding:14px}.kpis{grid-template-columns:repeat(2,1fr)}.grid2{grid-template-columns:1fr}}
</style></head><body>

function _mean(v){return v.length?v.reduce((a,b)=>a+b,0)/v.length:0;}
function _cv(v){if(v.length<3)return null;const m=_mean(v);if(!m)return null;
  const sd=Math.sqrt(_mean(v.map(x=>(x-m)*(x-m))));return sd/m*100;}
function _pmpmN(v){if(!v.length)return 0;return 0.5*v[v.length-1]+0.25*_mean(v.slice(-4))+0.25*_mean(v.slice(-8));}

    const solVals=fullSems.map(s=>sw[s]||0);
    const on=solVals.filter(x=>x>0);
    if(on.length<6)return;
    const esGG=c.toUpperCase().includes('GRAN GALLO');
    const base=esGG?solVals.filter(x=>x>0):solVals;
    const l4i=fullSems.slice(-4);
    const act4=_mean(l4i.map(s=>(D.TW[ci]||{})[s]||0).filter(x=>x>0));
    const sol4=_mean(l4i.map(s=>sw[s]||0).filter(x=>x>0));
    const rate=act4?sol4/act4:0;
    // CVs
    const pares=fullSems.filter(s=>(sw[s]||0)>0&&((D.TW[ci]||{})[s]||0)>0);
    const cvT=_cv(pares.map(s=>sw[s]));
    const cvR=_cv(pares.map(s=>sw[s]/D.TW[ci][s]));
    // proyecciones proxima semana

    const nts=pares.map(s=>D.TW[ci][s]);
    const pOf=_pmpmN(base);
    const pTx=rates.length?_pmpmN(rates)*_mean(nts.slice(-4)):pOf;

    const ul=lastAct?m[lastAct]:0;
    return {pm8,pm4,ul,pmpm:0.5*ul+0.25*pm4+0.25*pm8,m};}

/* ===== GRABACION DE PEDIDOS (PIN local + registro + excel + correo) ===== */
function pinOk(){
  let h=localStorage.getItem('bcip_pin');
  if(!h){const nuevo=prompt('Primera vez: crea tu PIN de gerente (Byron Santiago):');
    if(!nuevo)return false;localStorage.setItem('bcip_pin',btoa(nuevo));return true;}
  const p2=prompt('PIN de gerente:');
  return p2!==null&&btoa(p2)===h;}
function grabarPedido(){
  if(!pinOk()){alert('PIN incorrecto.');return;}
  const tipo=prompt('Tipo de pedido: escribe 1 (PEDIDO 1 · llega jueves) o 2 (PEDIDO 2 · llega lunes)');
  if(tipo!=='1'&&tipo!=='2')return;
  const reg=JSON.parse(localStorage.getItem('bcip_pedidos')||'[]');
  const semana=window._pedTargetW||fullSems[fullSems.length-1]+1;
  reg.push({fecha:new Date().toISOString().slice(0,16).replace('T',' '),semana,tipo:'P'+tipo,gg:semGG,usuario:'Byron Santiago · Gte. Canal Moderno',
    lineas:window._pedRowsFull.map(r=>({cod:r.cod,n:r.n,cant:tipo==='1'?r.p1:r.p2})).filter(l=>l.cant>0)});
  localStorage.setItem('bcip_pedidos',JSON.stringify(reg));
  renderRegistro();
  alert('Pedido P'+tipo+' grabado ('+reg[reg.length-1].lineas.length+' SKUs). Recuerda copiarlo a la hoja PEDIDOS del Excel para el histórico oficial.');}
function renderRegistro(){

    ${proyCli.map((r,ri)=>{

        } else h+=`<div class="hint">Sin productos por debajo en este cliente.</div>`;
        h+=`<div style="font-weight:800;color:var(--navy);font-size:11px;letter-spacing:1px;margin:10px 0 4px">RAZÓN / COMENTARIO PARA LA REUNIÓN</div>

          onclick="event.stopPropagation()" onchange="setRaz(${repW},'${r.n.replace(/'/g,"\\'")}',this.value)">${(raz[r.n]||'')}</textarea></td></tr>`;
      }
      return h;}).join('')}

function excelReporte(){
  const d=window._repData; if(!d)return;
  const raz=getRaz(d.repW);
  const wb=XLSX.utils.book_new();
  const data=[["ALIMENTOS BARCELONA · REPORTE SEMANAL CANAL MODERNO"],
   [`SEMANA S${d.repW} · Fill ${d.a.f.toFixed(1)}% · Proyección acertada: ${d.ratTot===null?'—':d.ratTot.toFixed(0)+'%'} (85–110% = en línea)`],[],
   ["CLIENTE","PROYECCION","SOLICITADO","% SOL/PROY","ENTREGADO","FILL %","VEREDICTO","RAZON"]];
  d.proyCli.forEach(r=>{
    const v=r.rat===null?"":(r.rat>110?"PROYECTE CORTO":(r.rat<85?"PROYECTE DE MAS":"EN LINEA"));
    data.push([r.n,Math.round(r.proy),Math.round(r.p),r.rat===null?"":+r.rat.toFixed(0),Math.round(r.e),+r.f.toFixed(1),v,raz[r.n]||""]);});
  data.push([],["PRODUCTOS POR DEBAJO POR CLIENTE"],["CLIENTE","PRODUCTO","PROYECCION","SOLICITADO","% SOL/PROY","ENTREGADO"]);
  d.proyCli.forEach(r=>r.bajos.slice(0,10).forEach(bx=>data.push([r.n,bx.n,Math.round(bx.proy),Math.round(bx.s),+bx.rat.toFixed(0),Math.round(bx.e)])));
  data.push([],["SKUs SIN MOVIMIENTO (desalojo)"],["PRODUCTO","PM4"]);
  d.muertos.slice(0,20).forEach(x=>data.push([D.arts[x.ai][0]+" "+D.arts[x.ai][1],Math.round(x.pm)]));
  const ws=XLSX.utils.aoa_to_sheet(data); ws['!cols']=[{wch:30},{wch:40},{wch:12},{wch:12},{wch:12},{wch:12},{wch:16},{wch:50}];
  XLSX.utils.book_append_sheet(wb,ws,`REPORTE S${d.repW}`);
  XLSX.writeFile(wb,`Reporte_Semanal_S${d.repW}.xlsx`);}
function correoReporte(){
  const d=window._repData; if(!d)return;
  const raz=getRaz(d.repW);
  let t=`REPORTE SEMANAL S${d.repW} · CANAL MODERNO\n`+
    `Fill rate: ${d.a.f.toFixed(1)}% · Proyección acertada: ${d.ratTot===null?'—':d.ratTot.toFixed(0)+'%'}\n\nPOR CLIENTE:\n`;
  d.proyCli.forEach(r=>{
    const v=r.rat===null?'':(r.rat>110?' [PROYECTÉ CORTO]':(r.rat<85?' [PROYECTÉ DE MÁS]':''));
    t+=`· ${r.n}: proy ${Math.round(r.proy).toLocaleString()} · sol ${Math.round(r.p).toLocaleString()} (${r.rat===null?'—':r.rat.toFixed(0)+'%'}) · fill ${r.p?r.f.toFixed(0):'—'}%${v}\n`;
    if(raz[r.n])t+=`   Razón: ${raz[r.n]}\n`;});
  if(d.muertos.length){t+=`\nSIN MOVIMIENTO (revisar desalojo):\n`;d.muertos.slice(0,8).forEach(x=>{t+=`· ${D.arts[x.ai][1]} (venía en ${Math.round(x.pm)}/sem)\n`;});}
  navigator.clipboard.writeText(t).then(()=>alert('Reporte copiado — pégalo en tu correo.'));}
/* ---------- palette ---------- */
let palIdx=0,palItems=[];
const IDX=[...PAGES.map(([h,n])=>({t:'PÁGINA',cl:'t-pag',n,go:h})),
  ...D.cads.map(c=>({t:'CLIENTE',cl:'t-cli',n:c,go:'#/cliente/'+enc(c)})),
  ...D.arts.map(a=>({t:'PRODUCTO',cl:'t-prod',n:a[0]+' · '+a[1],go:'#/producto/'+a[0]})),
  ...D.tiendas.map(t=>({t:'TIENDA',cl:'t-tie',n:t,go:'#/tienda/'+enc(t)}))];
function openPal(){pal.classList.add('show');palIn.value='';palRender();setTimeout(()=>palIn.focus(),30);}
function closePal(){pal.classList.remove('show');}
function palRender(){const q=palIn.value.toLowerCase().trim();
  palItems=(q?IDX.filter(i=>i.n.toLowerCase().includes(q)):IDX.slice(0,12)).slice(0,12);palIdx=0;
  palList.innerHTML=palItems.map((i,k)=>`<div class="pal-it ${k===palIdx?'sel':''}" onclick="palGo(${k})"><span>${i.n}</span><span class="t ${i.cl}">${i.t}</span></div>`).join('')||'<div class="pal-it">Sin resultados…</div>';}
function palKeys(e){if(e.key==='ArrowDown')palIdx=Math.min(palItems.length-1,palIdx+1);
  else if(e.key==='ArrowUp')palIdx=Math.max(0,palIdx-1);
  else if(e.key==='Enter'){palGo(palIdx);return;}
  else if(e.key==='Escape'){closePal();return;} else return;
  e.preventDefault();[...palList.children].forEach((el,k)=>el.classList.toggle('sel',k===palIdx));}
function palGo(k){if(!palItems[k])return;closePal();go(palItems[k].go);}
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openPal();}
  if(e.key==='Escape')closePal();});
if(!location.hash)location.hash='#/resumen';
route();
