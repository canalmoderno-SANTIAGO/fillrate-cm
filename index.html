<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill Rate · Cumplimiento y Ciclo del Pedido · Alimentos Barcelona</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D2A6D;--blue:#21299D;--sky:#4699EF;--red:#E00206;--guinda:#A60A1B;--tint:#EEF3FB;
--ink:#27314F;--gray:#6B7280;--line:#C9D5EA;--yel:#FFF2CC;--ok:#1E8E3E;--band:#DDE4F6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',Arial,sans-serif;background:#EEF1F7;color:var(--ink);font-size:13px}
.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px}
/* topbar */
.top{background:linear-gradient(135deg,#0D2A6D,#071B47);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:36px}
.top .t{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:1px}
.top .sp{flex:1}
.top a{color:#8FB4F0;font-size:12px;font-weight:700;text-decoration:none}
/* controles */
.ctrl{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--gray)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.red.on{background:var(--red);border-color:var(--red)}
/* pestañas estilo excel */
.tabs{display:flex;gap:2px;padding:10px 20px 0;background:#EEF1F7}
.tab{background:#DCE3F0;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
padding:9px 20px;font-size:12.5px;font-weight:800;color:var(--gray);cursor:pointer;letter-spacing:.4px}
.tab.on{background:#fff;color:var(--navy);border-top:3px solid var(--red)}
.sheet{background:#fff;margin:0 20px 30px;border:1px solid var(--line);border-top:none;padding:18px 20px;overflow-x:auto}
/* titulos de hoja (como el excel) */
.h1x{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px}
.meta{font-size:12px;margin-bottom:12px;line-height:1.9}
.meta b{color:#1F4EB8}
.meta .rj{color:var(--red);font-weight:700}
.secx{font-size:13px;font-weight:800;color:var(--ink);margin:20px 0 8px}
/* tablas estilo excel */
table{border-collapse:collapse;font-size:12px;min-width:100%}
th{background:#DCE7F5;color:var(--ink);font-weight:800;font-size:11px;padding:7px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
th.navy{background:var(--navy);color:#fff}
td{padding:6px 8px;border:1px solid #E3E9F4;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
td.yel{background:var(--yel);font-weight:700}
td.grn{color:var(--ok);font-weight:700}
tr.band td{background:var(--band);font-weight:800}
tr.tot td{background:#CFDCF0;font-weight:800;border-top:2px solid var(--navy)}
tr.clihdr td{background:#F1F4FB;font-weight:800;color:var(--navy);text-align:left}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{filter:brightness(.97)}
tr.cero td{color:#A8B2C6}
.neg{color:var(--guinda);font-weight:800}.pos{color:var(--ok);font-weight:800}
.com{font-size:11px;text-align:left;font-weight:600}
.com.ok{color:var(--ok)}.com.w{color:#8a6d00}
.hint{font-size:11.5px;color:var(--gray);margin-top:10px}
.btn{background:var(--tint);border:1px solid var(--line);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:800;color:var(--navy);cursor:pointer;font-family:inherit}
</style>
</head>

function pedWk(){ // semana-pedido cuyas VENTAS estan corriendo hoy (vie->jue)

  const iso=(()=>{const d=new Date(hoy);d.setHours(0,0,0,0);d.setDate(d.getDate()+3-((d.getDay()+6)%7));
    const w1=new Date(d.getFullYear(),0,4);return 1+Math.round(((d-w1)/86400000-3+((w1.getDay()+6)%7))/7);})();

const _demCache={};
function demandaDiaria(ai){

function proyDetalle(ai){

function simHTML(ai){
  const proy=pmpm(D.A.filter(r=>r[2]===ai),false);

    .map(l=>{const f=new Date(l[0]+'T00:00');const lim=new Date(f);lim.setDate(f.getDate()-20);

  for(let t=0;t<11;t++){

function planKey(){return 'bcip_plan_inv';}
function getPlan(){try{return JSON.parse(localStorage.getItem(planKey())||'{}')}catch(e){return{}}}
function setPlan(k,v){const r=getPlan();r[k]=v;localStorage.setItem(planKey(),JSON.stringify(r));}
function simular(ai,proy){
  // demanda diaria proyectada desde HOY con el peso de cada dia; lotes FEFO
  const w=D.W[ai]||D.Wg;                       // Lun=0..Dom=6
  const hoy=iniCob();                          // cobertura desde el dia SIGUIENTE al corte de ventas
  const lotes=((D.INVD&&D.INVD[ai])?[...D.INVD[ai]]:[]).sort((x,y)=>x[0]<y[0]?-1:1)
    .map(l=>{const f=new Date(l[0]+'T00:00');const lim=new Date(f);lim.setDate(f.getDate()-20);
      return {f,lim,dias:l[1],q:l[2],rest:l[2],merma:0};});
  const totInv=lotes.reduce((t,l)=>t+l.q,0)||((D.inv[ai]!==undefined)?D.inv[ai]:0);
  let inv=totInv, cob=null, fin=null, dem7=0;
  const H=42;
  let li=0;
  for(let t=0;t<H;t++){
    const d=new Date(hoy); d.setDate(hoy.getDate()+t);
    // regla de los 20 dias: al cruzar la linea (vencimiento - 20d) el lote YA NO SE PUEDE DESPACHAR
    lotes.forEach(l=>{if(l.rest>0&&(l.f<=d||l.lim<=d)){l.merma+=l.rest;inv-=l.rest;l.rest=0;}});
    const dem=demandaDiaria(ai)[(d.getDay()+6)%7]||0;
    if(t<7)dem7+=dem;
    let need=dem;
    while(need>0&&li<lotes.length){
      const l=lotes[li];
      if(l.rest<=0){li++;continue;}
      const usa=Math.min(l.rest,need); l.rest-=usa; inv-=usa; need-=usa;
      if(l.rest<=0)li++;
    }
    if(inv<=0&&cob===null){cob=t;fin=d;}
  }
  const merma=lotes.reduce((t,l)=>t+l.merma,0);          // unidades que cruzan la linea de 20d (o vencen) sin venderse
  const riesgoLotes=lotes.filter(l=>l.merma>0).map(l=>({f:l.f,dias:l.dias,un:Math.round(l.merma)}));
  const sugerido=Math.max(0,Math.round(dem7-totInv));
  return {cob:cob===null?H:cob,fin,merma:Math.round(merma),riesgoLotes,sugerido,dem7:Math.round(dem7),totInv};}
function asistente(ai,intent){
  const n=D.arts[ai][1], proy=pmpm(D.A.filter(r=>r[2]===ai),false);
  const wd=D.W[ai]||D.Wg, inv=D.inv[ai]!==undefined?D.inv[ai]:0;
  const sim=simular(ai,proy);
  const arr=simArrivals(ai); const llegTot=arr.reduce((t,a)=>t+a.amt,0);
  const lotes=(D.INVD&&D.INVD[ai])?[...D.INVD[ai]].sort((x,y)=>x[0]<y[0]?-1:1):[];
  const m={};D.A.filter(r=>r[2]===ai).forEach(r=>{m[r[0]]=(m[r[0]]||0)+r[3];});
  const w8=fullSems.slice(-8).map(x=>m[x]||0);
  const pend=w8.length>=8?(w8.slice(-4).reduce((a,b)=>a+b,0)/4-w8.slice(0,4).reduce((a,b)=>a+b,0)/4)/4:0;
  const stockFuturo=inv+llegTot;
  if(intent==='pase'){
    const rat=proy?stockFuturo/proy:0;
    if(rat>2) return `Sí — con las llegadas programadas, <b>${n}</b> acumula <b>${fmt(stockFuturo)}</b> unidades contra <b>${fmt(proy)}/semana</b> de venta: <b>${rat.toFixed(1)} semanas de inventario</b>. Recorta el próximo pedido${sim.merma?` — y ojo: <b>${fmt(sim.merma)}</b> unidades no se venderían antes de quedar con ≤20 días de vida`:''}.`;
    if(rat>1.4) return `Vas un poco arriba: <b>${fmt(stockFuturo)}</b> unidades (${rat.toFixed(1)} semanas de venta). No es grave, pero no le metas pedido extra${sim.merma?`, y vigila el vencimiento: ${fmt(sim.merma)} un en riesgo`:''}.`;
    if(sim.cob<7) return `Al contrario — te estás quedando corto: cobertura de <b>${sim.cob} día${sim.cob!==1?'s':''}</b> hoy. ${sim.sugerido?`Faltan ~<b>${fmt(sim.sugerido)}</b> unidades para asegurar la semana.`:''}`;
    return `No, vas bien: <b>${fmt(stockFuturo)}</b> unidades con venta de ${fmt(proy)}/sem = <b>${proy?(stockFuturo/proy).toFixed(1):'—'} semanas</b> — dentro del rango sano (1–1.4).`;
  }
  if(intent==='pedir'){
    const dd7=demandaDiaria(ai);
    const necP1=dd7[4]+dd7[5]+dd7[6]+dd7[0], necP2=dd7[1]+dd7[2]+dd7[3];
    const p2prox=(arr.find(a=>a.key.startsWith('p2'))||{}).amt||0;
    const cierre=Math.max(0,inv+p2prox-proy);
    const p1=Math.max(0,Math.round(necP1-cierre)), sob=Math.max(0,cierre-necP1);
    const p2=Math.max(0,Math.round(necP2-sob));
    return `Para la próxima semana de <b>${n}</b>: necesidad P1 ~<b>${fmt(necP1)}</b> (vie–lun) y P2 ~<b>${fmt(necP2)}</b> (mar–jue). Con el inventario proyectado al cierre (${fmt(cierre)}), el pedido sano es <b>P1 ${fmt(p1)} · P2 ${fmt(p2)}</b>. Juega con las llegadas ▲ del simulador para verlo día a día.`;
  }
  if(intent==='vence'){
    if(!lotes.length) return `No tengo lotes con fecha para <b>${n}</b> en el corte actual — pega el export con ExpDate para ver vencimientos.`;
    const det=lotes.map(l=>`· ${fmt(l[2])} un vencen el <b>${l[0].split('-').reverse().join('/')}</b> (${l[1]}d)`).join('<br>');
    return sim.merma?`⚠ Sí — al ritmo proyectado, <b>${fmt(sim.merma)}</b> unidades de <b>${n}</b> no se venderán a tiempo. Lotes:<br>${det}<br>Opciones: promoción, traslado o extensión de vida.`:`Todo se vende a tiempo al ritmo proyectado. Lotes:<br>${det}`;
  }
  if(intent==='demanda'){
    const cli=CLI11.map(ci=>({n:D.cads[ci],v:pmpm(D.A.filter(r=>r[1]===ci&&r[2]===ai),false)})).filter(x=>x.v>5).sort((a,b)=>b.v-a.v);
    return `<b>${n}</b> proyecta <b>${fmt(proy)}/semana</b>. Tendencia 8 sem: <b>${pend>=0?'+':''}${fmt(pend)}/sem</b> ${pend<-proy*0.05?'— viene cayendo, cuidado con sobre-pedir':pend>proy*0.05?'— viene subiendo':'— estable'}. Quién lo compra: ${cli.slice(0,4).map(c=>`${c.n} (${fmt(c.v)})`).join(' · ')||'sin clientes activos'}.`;
  }
  return `<b>${n}</b>: ${fmt(inv)} en bodega · proyección ${fmt(proy)}/sem · cobertura ${sim.cob>=42?'42+':sim.cob} días${sim.merma?` · ⚠ ${fmt(sim.merma)} un en riesgo de vencimiento`:''}${sim.cob<7?` · ⚠ pedir ~${fmt(sim.sugerido)}`:''}. Pregúntame: ¿me pasé?, ¿cuánto pido?, ¿se vence algo?, ¿cómo viene la demanda?`;
}

function simDias(ai,proy,nd){
  // inventario proyectado dia a dia: FEFO + llegadas P1/P2 (editables en el simulador)
  const w=D.W[ai]||D.Wg;
  const hoy=iniCob();
  const lotes=((D.INVD&&D.INVD[ai])?[...D.INVD[ai]]:[]).sort((x,y)=>x[0]<y[0]?-1:1)
    .map(l=>{const f=new Date(l[0]+'T00:00');const lim=new Date(f);lim.setDate(f.getDate()-20);
      return {f,lim,q:l[2],rest:l[2]};});
  let inv=lotes.reduce((t,l)=>t+l.q,0)||((D.inv[ai]!==undefined)?D.inv[ai]:0);
  const arr=simArrivals(ai);
  const out=[];let li=0;
  for(let t=0;t<nd;t++){
    const d=new Date(hoy);d.setDate(hoy.getDate()+t);
    let vence=0;
    lotes.forEach(l=>{if(l.rest>0&&(l.f<=d||(l.lim&&l.lim<=d))){vence+=l.rest;inv-=l.rest;l.rest=0;}});
    const lleg=arr.filter(a=>a.f.getTime()===d.getTime()).reduce((t2,a)=>t2+a.amt,0);
    if(lleg>0){inv+=lleg;lotes.push({f:new Date(d.getTime()+45*86400000),q:lleg,rest:lleg});}
    let need=demandaDiaria(ai)[(d.getDay()+6)%7]||0;
    const dem=need;
    while(need>0&&li<lotes.length){const l=lotes[li];if(l.rest<=0){li++;continue;}
      const usa=Math.min(l.rest,need);l.rest-=usa;inv-=usa;need-=usa;if(l.rest<=0)li++;}
    if(need>0)inv-=need;
    out.push({d,inv:Math.round(inv),lleg,vence:Math.round(vence),dem:Math.round(dem)});
  }
  return out;}

  </div>`;}
function avanceSemana(all){
  const w=pedWk(), L=monday(w);
  const ini=new Date(L); ini.setDate(L.getDate()-3);          // viernes: arranca la ventana de ventas
  const corte=new Date((D.corte||'')+'T00:00');
  if(corte<ini)return '';
  const dias=[],DN=['LUN','MAR','MIÉ','JUE','VIE','SÁB','DOM'];
  for(let d=new Date(ini);d<=corte;d.setDate(d.getDate()+1))dias.push(new Date(d));
  const fk=dias.map(d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`);
  const real={}; fk.forEach(k=>{(D.B[k]||[]).forEach(r=>{real[r[2]]=(real[r[2]]||0)+r[3];});});
  const rows=all.map(r=>{
    const dem=demandaDiaria(r.ai);
    const esp=dias.reduce((t,d)=>t+(dem[(d.getDay()+6)%7]||0),0);
    const proySem=dem.reduce((a,b)=>a+b,0);
    if(esp<30&&(real[r.ai]||0)<30)return null;
    const re=real[r.ai]||0, pct=esp>0?re/esp*100:(re>0?999:100);
    let ver='EN LÍNEA',cl='ok',acc='';
    if(pct<85){ver='VA CORTO';cl='w';acc='⚠ considera RECORTAR o PARAR el próximo pedido';}
    else if(pct>115){ver='VA ARRIBA';cl='neg2';acc='▲ considera un pedido EXTRA';}
    return {ai:r.ai,cod:r.cod,n:r.n,proySem,esp,re,pct,ver,cl,acc,dev:Math.abs(pct-100)};
  }).filter(Boolean).sort((a,b)=>b.dev-a.dev);
  if(!rows.length)return '';
  const T={e:0,r:0};rows.forEach(x=>{T.e+=x.esp;T.r+=x.re;});
  const tpct=T.e?T.r/T.e*100:100;
  let h=`<div class="secx" style="margin-top:26px">📈 SEMANA S${w} EN CURSO — ¿SE ESTÁ CUMPLIENDO LO PROYECTADO?</div>
  <div class="meta">Ventana vie ${fdc(ini)} → jue · llevas <b>${dias.length} día${dias.length!==1?'s':''}</b> de venta cargados (hasta ${fdc(corte)}) ·
  <b>ESPERADO A HOY</b> = lo que la proyección decía que llevarías vendido · si la variación es grande, ajusta el pedido a tiempo ·
  avance total: <b style="color:${tpct<85?'#8a6d00':tpct>115?'var(--guinda)':'var(--ok)'}">${tpct.toFixed(0)}%</b></div>
  <table><thead><tr><th class="navy">SKU</th><th class="navy" style="text-align:left">DESCRIPCION</th>
  <th>PROY SEMANA</th><th>ESPERADO A HOY</th><th>REAL A HOY</th><th style="background:var(--yel)">% AVANCE</th>
  <th style="text-align:left">LECTURA</th><th style="text-align:left">ACCIÓN</th></tr></thead><tbody>`;
  rows.slice(0,30).forEach(x=>{
    const ab=openAv.has(x.ai);
    h+=`<tr class="rowlink" onclick="openAv.has(${x.ai})?openAv.delete(${x.ai}):(openAv.add(${x.ai}),closedInv.add(${x.ai}),openInv.delete(${x.ai}));render()">
    <td>${x.cod}</td><td class="l" style="font-weight:700">${ab?'▼ ':'▶ '}${x.n}</td>
    <td>${fmt(x.proySem)}</td><td>${fmt(x.esp)}</td><td style="font-weight:800">${fmt(x.re)}</td>
    <td class="yel" style="font-weight:800;color:${x.pct<85?'#8a6d00':x.pct>115?'var(--guinda)':'var(--ok)'}">${x.pct>400?'400+':x.pct.toFixed(0)}%</td>
    <td class="com" style="color:${x.cl==='w'?'#8a6d00':x.cl==='neg2'?'var(--guinda)':'var(--ok)'};font-weight:800">${x.ver}</td>
    <td class="com">${x.acc}</td></tr>`;
    if(ab)h+=`<tr><td colspan="8" style="background:#F7FAFE;padding:12px 16px;text-align:left" onclick="event.stopPropagation()">${detalleHTML(x.ai)}</td></tr>`;});
  h+=`<tr class="tot"><td></td><td class="l">TOTAL</td><td></td><td>${fmt(T.e)}</td><td>${fmt(T.r)}</td>
  <td>${tpct.toFixed(0)}%</td><td colspan="2"></td></tr></tbody></table>
  <div class="hint">85–115% = en línea. Abajo de 85% el producto se está quedando (riesgo de sobre-stock → recorta pedido). Arriba de 115% vuela (riesgo de quiebre → pedido extra). Clic en la fila abre su simulador.</div>`;
  return h;}
function hojaInventario(){
  const skus=(baseSKUs().length?baseSKUs():Object.keys(D.inv).map(Number));
  const FRE=new Set((D.PSF||[]).map(Number)), REG=new Set((D.PSR||[]).map(Number));
  const all=skus.map(invRow).filter(Boolean);
  // filtro de estado
  const nR20=all.filter(r=>r.sim.merma>0).length, nFal=all.filter(r=>r.cl==='neg').length,
        nSob=all.filter(r=>r.sem==='SOBRE-INVENTARIO').length;
  const fil=r=>INVF==='R20'?r.sim.merma>0:INVF==='FALTA'?r.cl==='neg':INVF==='SOBRE'?r.sem==='SOBRE-INVENTARIO':true;
  let html=`
  <div class="h1x">INVENTARIO — BODEGA 1010 (${TIPO==='REG'?'solo regulares':TIPO==='FRE'?'solo frescos':'todos'}, unidades)</div>
  <div class="meta">Fuente: <b>${D.invFuente}</b> &nbsp;·&nbsp; <b>Venta cargada hasta el ${fd(new Date((D.corte||'')+'T00:00'))}</b> → la cobertura se calcula del <b class="rj">${fd(iniCob())}</b> en adelante &nbsp;·&nbsp; COBERTURA = días que aguanta al ritmo proyectado (sano: ≥7) &nbsp;·&nbsp; <b>DESPACHABLE</b> = existencia sin la fecha corta (≤20d, ya no va a cadenas) &nbsp;·&nbsp; <b>YA VIENE</b> = pedido/traslado de la próxima semana &nbsp;·&nbsp; SEMANAS STOCK = existencia ÷ venta semanal (sano: 1–1.6) &nbsp;·&nbsp; tira 14 días: <span style="display:inline-block;width:11px;height:12px;background:#CDE8D2;border-radius:2px"></span> cubierto · <span style="display:inline-block;width:11px;height:12px;background:var(--red);border-radius:2px"></span> quiebre · <span style="display:inline-block;width:11px;height:12px;background:#E7C55A;border-radius:2px"></span> vence lote · <span style="display:inline-block;width:11px;height:12px;background:#CDE8D2;border-top:3px solid var(--blue);border-radius:2px"></span> llega pedido &nbsp;·&nbsp; clic en un producto = día-a-día + asistente</div>`;
  html+=`<div class="chips" style="margin:4px 0 6px">
    <div class="chip ${INVF==='ALL'?'on':''}" onclick="INVF='ALL';render()">TODOS (${all.length})</div>
    <div class="chip red ${INVF==='R20'?'on':''}" onclick="INVF='R20';render()">⏳ SE PASAN DE 20 DÍAS (${nR20})</div>
    <div class="chip red ${INVF==='FALTA'?'on':''}" onclick="INVF='FALTA';render()">🔴 FALTA INVENTARIO (${nFal})</div>
    <div class="chip ${INVF==='SOBRE'?'on':''}" onclick="INVF='SOBRE';render()">🔵 SOBRE-STOCK (${nSob})</div>
  </div>`;
  if(TIPO!=='REG')html+=invTabla(all.filter(fil).filter(r=>FRE.has(r.ai)),'🥩 FRESCOS','pedido el VIERNES · el inventario del viernes AM debe cubrir sáb → jue');
  if(TIPO!=='FRE')html+=invTabla(all.filter(fil).filter(r=>REG.has(r.ai)&&!(TIPO==='ALL'&&FRE.has(r.ai))),'📦 REGULARES','pedido el LUNES · el inventario debe cubrir mar + mié + jue');
  if(TIPO==='ALL'){const otros=all.filter(fil).filter(r=>!FRE.has(r.ai)&&!REG.has(r.ai));
    if(otros.length)html+=invTabla(otros,'📋 FUERA DE PROGRAMACIÓN','SKUs con inventario o venta que no están en tus programaciones');}
  // ============ AVANCE DE LA SEMANA: proyectado vs real ============
  html+=avanceSemana(all);
  // ============ ALERTAS (abajo, simples) ============
  const faltas=all.filter(r=>r.cl==='neg').sort((a,b)=>a.sim.cob-b.sim.cob);
  const vencen=all.filter(r=>r.cl==='w'&&r.sim.merma>0).sort((a,b)=>b.sim.merma-a.sim.merma);
  const sobres=all.filter(r=>r.sem==='SOBRE-INVENTARIO').sort((a,b)=>b.semStock-a.semStock);
  html+=`<div class="secx" style="margin-top:24px">ALERTAS</div>`;
  if(!faltas.length&&!vencen.length&&!sobres.length)html+=`<div class="hint">Sin alertas — inventario sano en todos los SKUs. ✔</div>`;
  faltas.forEach(r=>{
    html+=`<div style="padding:7px 10px;border-left:4px solid var(--guinda);background:#FBE7E8;margin-bottom:6px;font-size:12.5px;border-radius:0 6px 6px 0">
    🔴 <b>${r.n}</b> — solo <b>${r.sim.cob} día${r.sim.cob!==1?'s':''}</b> de inventario${r.sim.fin?` (alcanza hasta el ${fd(r.sim.fin)})`:''} · pedir <b>${fmt(r.sim.sugerido)}</b> unidades</div>`;});
  vencen.forEach(r=>{
    html+=`<div style="padding:7px 10px;border-left:4px solid #B97E0B;background:#FFF3C4;margin-bottom:6px;font-size:12.5px;border-radius:0 6px 6px 0">
    🟡 <b>${r.n}</b> — <b>${fmt(r.sim.merma)}</b> unidades no se venderán a tiempo (${r.sim.riesgoLotes.map(l=>fmt(l.un)+' un del '+fdc(l.f)).join(' · ')})</div>`;});
  sobres.forEach(r=>{
    html+=`<div style="padding:7px 10px;border-left:4px solid var(--blue);background:#EEF3FB;margin-bottom:6px;font-size:12.5px;border-radius:0 6px 6px 0">
    🔵 <b>${r.n}</b> — <b>${r.semStock.toFixed(1)} semanas</b> de stock (${fmt(r.inv)} un vs ${fmt(r.proy)}/sem) · recorta el próximo pedido</div>`;});
  html+=`<div class="hint">🔴 falta inventario (&lt;7 días) · 🟡 quedará producto con ≤20 días de vida sin venderse · 🔵 sobre-inventario (&gt;1.6 semanas de stock).</div>`;
  return html;
}
render();
</script>
