<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fill Rate · Cumplimiento y Ciclo del Pedido · Alimentos Barcelona</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D2A6D;--blue:#21299D;--sky:#4699EF;--red:#E00206;--guinda:#A60A1B;--tint:#EEF3FB;
--ink:#27314F;--gray:#6B7280;--line:#C9D5EA;--yel:#FFF2CC;--ok:#1E8E3E;--band:#DDE4F6}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Calibri,'Segoe UI',Arial,sans-serif;background:#EEF1F7;color:var(--ink);font-size:13px}
.bebas{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:1px}
/* topbar */
.top{background:linear-gradient(135deg,#0D2A6D,#071B47);color:#fff;padding:10px 20px;display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.top img{height:36px}
.top .t{font-family:'Bebas Neue',Impact,sans-serif;font-size:22px;letter-spacing:1px}
.top .sp{flex:1}
.top a{color:#8FB4F0;font-size:12px;font-weight:700;text-decoration:none}
/* controles */
.ctrl{background:#fff;border-bottom:1px solid var(--line);padding:10px 20px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lbl{font-size:10px;font-weight:800;letter-spacing:1.5px;color:var(--gray)}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chip{background:var(--tint);border:1px solid var(--line);border-radius:6px;padding:5px 12px;font-size:12px;font-weight:700;cursor:pointer}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip.red.on{background:var(--red);border-color:var(--red)}
/* pestañas estilo excel */
.tabs{display:flex;gap:2px;padding:10px 20px 0;background:#EEF1F7}
.tab{background:#DCE3F0;border:1px solid var(--line);border-bottom:none;border-radius:8px 8px 0 0;
padding:9px 20px;font-size:12.5px;font-weight:800;color:var(--gray);cursor:pointer;letter-spacing:.4px}
.tab.on{background:#fff;color:var(--navy);border-top:3px solid var(--red)}
.sheet{background:#fff;margin:0 20px 30px;border:1px solid var(--line);border-top:none;padding:18px 20px;overflow-x:auto}
/* titulos de hoja (como el excel) */
.h1x{font-size:15px;font-weight:800;color:var(--ink);margin-bottom:10px}
.meta{font-size:12px;margin-bottom:12px;line-height:1.9}
.meta b{color:#1F4EB8}
.meta .rj{color:var(--red);font-weight:700}
.secx{font-size:13px;font-weight:800;color:var(--ink);margin:20px 0 8px}
/* tablas estilo excel */
table{border-collapse:collapse;font-size:12px;min-width:100%}
th{background:#DCE7F5;color:var(--ink);font-weight:800;font-size:11px;padding:7px 8px;border:1px solid var(--line);text-align:center;white-space:nowrap}
th.navy{background:var(--navy);color:#fff}
td{padding:6px 8px;border:1px solid #E3E9F4;text-align:right;white-space:nowrap;font-variant-numeric:tabular-nums}
td.l{text-align:left}
td.yel{background:var(--yel);font-weight:700}
td.grn{color:var(--ok);font-weight:700}
tr.band td{background:var(--band);font-weight:800}
tr.tot td{background:#CFDCF0;font-weight:800;border-top:2px solid var(--navy)}
tr.clihdr td{background:#F1F4FB;font-weight:800;color:var(--navy);text-align:left}
tr.rowlink{cursor:pointer}
tr.rowlink:hover td{filter:brightness(.97)}
tr.cero td{color:#A8B2C6}
.neg{color:var(--guinda);font-weight:800}.pos{color:var(--ok);font-weight:800}
.com{font-size:11px;text-align:left;font-weight:600}
.com.ok{color:var(--ok)}.com.w{color:#8a6d00}
.hint{font-size:11.5px;color:var(--gray);margin-top:10px}
.btn{background:var(--tint);border:1px solid var(--line);border-radius:7px;padding:6px 13px;font-size:11.5px;font-weight:800;color:var(--navy);cursor:pointer;font-family:inherit}
/* ============ PRO THEME v2 · dirección de arte ============ */
:root{--ink2:#1C2433;--mut:#8A94A8;--hair:#E6EBF4;--bgapp:#F6F8FB;
--st-red:#E00206;--st-amb:#E3A93C;--st-blu:#21299D;--st-grn:#1E8E3E;--st-gry:#C2CBDA;
--tl-cov:#4699EF;--tl-off:#DCE7F5;--tl-brk:#E00206;--tl-ven:#FFD34D;--act:#E00206}
.bb{font-family:'Bebas Neue',Impact,sans-serif;letter-spacing:.5px;font-weight:400}
body{font-family:'Inter',Calibri,'Segoe UI',Arial,sans-serif;font-size:12.5px;-webkit-font-smoothing:antialiased;background:var(--bgapp);color:var(--ink2)}
td,th,.tnum{font-variant-numeric:tabular-nums}
td{padding:5px 8px;border-color:#EDF1F8}
th{padding:6px 8px}
tr.rowlink:hover td{background:#F4F7FD!important;filter:none}
.chip{border-radius:999px;padding:4px 13px;font-size:11.5px}
.btn{border-radius:999px}
.btn:hover{background:#E2EAF8}
.sheet{box-shadow:0 1px 3px rgba(13,42,109,.07);border-radius:0 0 12px 12px}
.kpis{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.kpi{flex:1;min-width:118px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.kpi{border:1px solid var(--hair);border-radius:12px;box-shadow:none;padding:10px 14px 9px}
.kpi .v{font-family:'Inter',sans-serif;font-weight:800;font-size:20px;line-height:1;letter-spacing:-.3px}
.kpi .l{font-size:8.5px;font-weight:700;letter-spacing:1.4px;color:var(--mut);margin-top:5px}
.ghead{display:grid;align-items:center;padding:8px 14px;font-size:9px;letter-spacing:1.4px;color:var(--navy);font-weight:800;border-bottom:2px solid var(--red);text-transform:uppercase;background:#EEF3FB}
.ghead span[data-s]{cursor:pointer}
.ghead span[data-s]:hover{color:var(--navy)}
.invrow{display:grid;align-items:center;gap:14px;padding:9px 14px 9px 11px;background:#fff;border-bottom:1px solid #F0F3F9;cursor:pointer;border-left:3px solid transparent;transition:background .12s}
.invrow:hover{background:#F7FAFE}
.pill-fc{display:inline-block;background:#FDECEC;color:#A60A1B;border-radius:99px;padding:1px 8px;font-size:8.5px;font-weight:700;letter-spacing:.4px;margin-top:2px}
</style>
</head>

 'EL GRAN GALLO':'GRAN GALLO','TIENDA DE ORIENTE':'OASIS','OTROS SUPERMERCADOS':'OTROS'};
function proyPed(w,ai,ci){
  const h=((D.PMH||{})[w]||{})[ai];
  if(!h)return null;
  if(ci===undefined||ci===null)
    return h.MOD!==undefined?h.MOD:Object.keys(h).reduce((t,k)=>t+(k==='MOD'?0:h[k]),0);
  const cad=(D.cads[ci]||'').toUpperCase();
  if(cad==='ECONOSUPER')return 0;   // en tu Excel va dentro de PM UNISUPER (se muestra en La Torre)
  const k=PMCLI[cad];
  return k!==undefined?(h[k]||0):0;
}
function pmNota(w){ // avisa si el PM MODELO de esa semana no sumo GRAN GALLO (paso en S37)
  const H=(D.PMH||{})[w]; if(!H)return '';
  let mod=0,cli=0,gg=0;
  Object.values(H).forEach(h=>{mod+=h.MOD||0;
    Object.keys(h).forEach(k=>{if(k!=='MOD')cli+=h[k];if(k==='GRAN GALLO')gg+=h[k];});});
  if(gg>0&&Math.abs((cli-mod)-gg)<Math.max(20,gg*0.15))
    return ` &nbsp;·&nbsp; <span class="rj">⚠ en S${w} el PM MODELO NO sumó GRAN GALLO (${fmt(gg)} un fuera del total — las filas de Gran Gallo sí lo muestran)</span>`;
  return '';}
function monday(wk){const y=new Date().getFullYear();const j4=new Date(y,0,4);
  const l1=new Date(j4);l1.setDate(j4.getDate()-((j4.getDay()+6)%7));
  const d=new Date(l1);d.setDate(l1.getDate()+(wk-1)*7);return d;}
const MES3=['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const fd=d=>`${['dom','lun','mar','mié','jue','vie','sáb'][d.getDay()]} ${d.getDate()}-${MES3[d.getMonth()]}`;
const fdc=d=>`${d.getDate()}/${(d.getMonth()+1).toString().padStart(2,'0')}`;
function iniCob(){
  const c=new Date((D.corte||'2026-01-01')+'T00:00'); c.setDate(c.getDate()+1);
  const h=new Date(); h.setHours(0,0,0,0);
  return c>h?c:h;}
function avisoEnCurso(dd){
  const hoy=new Date(); hoy.setHours(0,0,0,0);
  const fin=dd(9);                   // miercoles: fin de ventas P2
  const ini=dd(3);                   // jueves: inicio de ventas P1
  if(hoy>fin) return '';
  const trans=Math.max(0,Math.round((hoy-ini)/86400000)+1);
  return `<div style="background:#FFF3C4;border:1px solid #E8D48A;border-radius:8px;padding:9px 14px;margin-bottom:12px;font-size:12.5px">
  ⏳ <b>SEMANA EN CURSO</b> — la ventana de ventas va del <b>${fdc(ini)}</b> al <b>${fdc(fin)}</b>; llevas <b>${trans} de 7 días</b>.
  Lo que ves es parcial (incluye pedidos ya capturados con entrega futura). El % vs proyección se completa al cierre del jueves.</div>`;}

const vcWks=Object.keys(D.VC||{}).map(Number).sort((a,b)=>a-b);

function baseSKUs(){return (TIPO==='REG'?(D.PSR||[]):(TIPO==='FRE'?(D.PSF||[]):(D.PS||[]))).map(Number);}
function inPS(ai){const b=baseSKUs();return !b.length||b.includes(+ai);}
function expandirTodo(){openAll=!openAll;openP.clear();render();}

/* ============ HOJA 1 · CUMPLIMIENTO ============ */
function hojaCumplimiento(dd){
  const tr=D.TR[W]||{}, pw=D.PW[W]||{};
  const skus=[...new Set([...Object.keys(tr),...Object.keys(pw)].filter(inPS))].map(Number);
  const T={p1:0,r1:0,p2:0,r2:0,ex:0};
  const rows=skus.map(ai=>{
    const v=pw[ai]||[0,0,0], t=tr[ai]||[0,0];
    const [p1,p2,ex]=v,[r1,r2]=t;
    if(p1+p2+ex+r1+r2<=0)return null;
    T.p1+=p1;T.r1+=r1;T.p2+=p2;T.r2+=r2;T.ex+=ex;
    const tot=p1+p2+ex, totr=r1+r2;
    let com='',cc='w';
    const _um=Math.max(5,tot*0.05), falt=tot-totr;
    if(tot<=0&&totr>0){com=`SIN PEDIDO — llegaron ${fmt(totr)} un`;}
    else if(tot>0){
      if(falt>_um){ // debe producto de verdad
        const _parts=[];
        if(p1>0&&r1<p1*0.95)_parts.push(`P1 corto ${fmt(p1-r1)}`);
        if(p2>0&&r2<=0)_parts.push(`P2 (${fmt(p2)}) sin recibir`);
        else if(p2>0&&r2<p2*0.95)_parts.push(`P2 corto ${fmt(p2-r2)}`);
        if(r1>p1*1.05)com=`SE ADELANTÓ a la ventana del P1 y aun así FALTAN ${fmt(falt)} un`;
        else com=`PRODUCCIÓN DEBE ${fmt(falt)} un — ${_parts.join(' · ')||'entrega incompleta'}`;
      }else if(falt<-_um){
        com=`LLEGÓ DE MÁS (+${fmt(-falt)} un)${(r1>p1*1.05&&p2>0&&r2<p2*0.95)?' — adelantaron el P2 en la ventana del P1':''}`;
      }else{ // total completo: solo timing
        if(p1>0&&r1<p1*0.95&&r2>p2*1.05)com='TOTAL COMPLETO — SE PASÓ DESPUÉS: parte del P1 llegó en la ventana del P2';
        else if(p2>0&&r2<p2*0.95&&r1>p1*1.05)com='TOTAL COMPLETO — SE PASÓ ANTES: parte del P2 llegó en la ventana del P1';
        else {com='EN TIEMPO';cc='ok';}}}
    if(!matchF(D.arts[ai][0],D.arts[ai][1]))return null;
    return {ai,cod:D.arts[ai][0],n:D.arts[ai][1],p1,r1,p2,r2,ex,tot,totr,dif:totr-tot,com,cc};
  }).filter(Boolean).sort((a,b)=>b.tot-a.tot);
  const totT=T.p1+T.p2+T.ex, totR=T.r1+T.r2;

  const dias=[[-7,0],[-6,1],[-5,2],[-4,3],[-3,4],[-2,5],[-1,6]];
  const tc=D.TRD[W]||{};
  const dRows=skus.map(ai=>{
    const b=tc[ai]||[0,0,0,0,0,0,0];
    const vals=dias.map(([off,dow])=>b[dow]);
    const tt=vals.reduce((x,y)=>x+y,0);
    return (tt>0&&matchF(D.arts[ai][0],D.arts[ai][1]))?{n:D.arts[ai][1],vals,tt}:null;}).filter(Boolean).sort((a,b)=>b.tt-a.tt);
  return `
  <div class="h1x">CUMPLIMIENTO SEMANA ${W} — PEDIDO VS TRASLADADO POR PRODUCCIÓN — BODEGA DE SUPERMERCADO</div>
  <div class="meta">
    Semana: <span class="rj">${W}</span> &nbsp;&nbsp; Almacén destino: <span class="rj">1010</span> · origen: <span class="rj">1009</span><br>
    PEDIDO 1 — traslados del <b>${fd(dd(-7))}</b> al <b>${fd(dd(-5))}</b> (Lun-Mie sem ant) &nbsp;·&nbsp; VENTAS P1 — del <b>${fd(dd(-3))}</b> al <b>${fd(dd(0))}</b> (Vie-Lun)<br>
    PEDIDO 2 — traslados del <b>${fd(dd(-4))}</b> al <b>${fd(dd(-1))}</b> (Jue-Dom sem ant) &nbsp;·&nbsp; VENTAS P2 — del <b>${fd(dd(1))}</b> al <b>${fd(dd(3))}</b> (Mar-Jue)</div>
  <div class="secx">1. PEDIDO VS TRASLADADO POR PRODUCCIÓN (unidades)</div>
  <table><thead><tr>
    <th class="navy">SKU</th><th class="navy" style="text-align:left">DESCRIPCION</th>
    <th>PEDIDO 1 (un)</th><th>RECIBIDO P1 (un)</th><th style="background:var(--yel)">% CUMPL P1</th>
    <th>PEDIDO 2 (un)</th><th>RECIBIDO P2 (un)</th><th style="background:var(--yel)">% CUMPL P2</th>
    <th>PEDIDO EXTRA (un)</th><th>TOTAL PEDIDO + EXTRA</th><th>TOTAL RECIBIDO</th><th>DIFERENCIA (un)</th>
    <th style="background:var(--yel)">% CUMPLIMIENTO</th><th style="text-align:left">COMENTARIO — TIMING DE ENTREGA</th></tr></thead><tbody>
  ${rows.map(r=>`<tr>
    <td>${r.cod}</td><td class="l" style="font-weight:700">${r.n}</td>
    <td style="color:#1F4EB8;font-weight:700">${r.p1?fmt(r.p1):'-'}</td><td>${r.r1?fmt(r.r1):'-'}</td><td class="yel">${pct1(r.r1,r.p1)||'-'}</td>
    <td style="color:#1F4EB8;font-weight:700">${r.p2?fmt(r.p2):'-'}</td><td>${r.r2?fmt(r.r2):'-'}</td><td class="yel">${pct1(r.r2,r.p2)||'-'}</td>
    <td>${r.ex?fmt(r.ex):'-'}</td><td style="font-weight:700">${fmt(r.tot)}</td><td style="font-weight:700">${fmt(r.totr)}</td>
    <td class="${r.dif<0?'neg':'pos'}">${r.dif>0?'+':''}${fmt(r.dif)}</td>
    <td class="yel">${r.tot?pct1(r.totr,r.tot):'-'}</td><td class="com ${r.cc}">${r.com}</td></tr>`).join('')||'<tr><td colspan="14" class="l">Sin pedidos ni traslados esta semana con este filtro.</td></tr>'}
  <tr class="tot"><td></td><td class="l">TOTAL</td>
    <td>${fmt(T.p1)}</td><td>${fmt(T.r1)}</td><td class="yel">${pct1(T.r1,T.p1)}</td>
    <td>${fmt(T.p2)}</td><td>${fmt(T.r2)}</td><td class="yel">${pct1(T.r2,T.p2)}</td>
    <td>${fmt(T.ex)}</td><td>${fmt(totT)}</td><td>${fmt(totR)}</td>
    <td class="${totR-totT<0?'neg':'pos'}">${totR-totT>0?'+':''}${fmt(totR-totT)}</td>
    <td class="yel">${pct1(totR,totT)}</td><td></td></tr></tbody></table>
  <div class="secx">2. DESPACHOS DE PRODUCCIÓN POR DÍA — LO QUE VA DE LA SEMANA (unidades)</div>
  <table><thead><tr><th class="navy">SKU / DESCRIPCION</th>
    ${dias.map(([off])=>`<th>${fd(dd(off))}</th>`).join('')}<th>TOTAL (un)</th></tr></thead><tbody>
  ${dRows.map(r=>`<tr><td class="l" style="font-weight:700">${r.n}</td>
    ${r.vals.map(v=>`<td>${v?fmt(v):''}</td>`).join('')}<td style="font-weight:800">${fmt(r.tt)}</td></tr>`).join('')||'<tr><td colspan="9" class="l">Sin despachos registrados en la ventana.</td></tr>'}
  </tbody></table>
  <div class="secx">3. PEDIDO VS RECIBIDO — POR PEDIDO (unidades)</div>
  <table style="max-width:820px"><thead><tr><th class="navy">SKU / DESCRIPCION</th>
    <th>PEDIDO 1 (un)</th><th>RECIBIDO P1 (un)</th><th style="background:var(--yel)">% P1</th>
    <th>PEDIDO 2 (un)</th><th>RECIBIDO P2 (un)</th><th style="background:var(--yel)">% P2</th></tr></thead><tbody>
  ${rows.filter(r=>r.tot>0).map(r=>`<tr><td class="l" style="font-weight:700">${r.n}</td>
    <td>${r.p1?fmt(r.p1):'-'}</td><td>${r.r1?fmt(r.r1):'-'}</td><td class="yel">${pct1(r.r1,r.p1)||'-'}</td>
    <td>${r.p2?fmt(r.p2):'-'}</td><td>${r.r2?fmt(r.r2):'-'}</td><td class="yel">${pct1(r.r2,r.p2)||'-'}</td></tr>`).join('')}
  </tbody></table>

}

  <span style="display:flex;align-items:center;gap:7px"><span style="font-size:9.5px;font-weight:800;letter-spacing:1.2px;color:var(--gray)">ORDEN</span>
    <select onchange="SORTI=this.value;localStorage.setItem('bcip_inv_sort',SORTI);if(SORTI==='man'&&!getOrden().length){setOrden([])};render()" style="border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:6px 9px;font-family:inherit;font-size:11.5px;font-weight:600">
      ${[['urg','Urgencia'],['cod','Código'],['alf','Alfabético'],['man','Manual (arrastra)']].map(([k,n])=>`<option value="${k}" ${SORTI===k?'selected':''}>${n}</option>`).join('')}
    </select></span>
  </div>`;
  if(TIPO!=='REG')html+=invTabla(all.filter(fil).filter(r=>FRE.has(r.ai)),'🥩 FRESCOS','pedido el VIERNES · el inventario del viernes AM debe cubrir sáb → jue');
  if(TIPO!=='FRE')html+=invTabla(all.filter(fil).filter(r=>REG.has(r.ai)&&!(TIPO==='ALL'&&FRE.has(r.ai))),'📦 REGULARES','pedido el LUNES · el inventario debe cubrir mar + mié + jue');
  if(TIPO==='ALL'){const otros=all.filter(fil).filter(r=>!FRE.has(r.ai)&&!REG.has(r.ai));
    if(otros.length)html+=invTabla(otros,'📋 FUERA DE PROGRAMACIÓN','SKUs con inventario o venta que no están en tus programaciones');}
  // ============ AVANCE DE LA SEMANA: proyectado vs real ============
  html+=avanceSemana(all);
  return html;
}
render();
</script>
