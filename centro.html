<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Centro de Control · Canal Moderno</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--navy:#0D2A6D;--deep:#071B47;--red:#E00206;--sky:#4699EF;--ok:#1E9E4B;--amb:#E8A812;
--paper:#F4F6F9;--card:#fff;--ink:#101C3D;--mut:#7A879F;--hair:#E8ECF3}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--paper);font-family:Inter,sans-serif;color:var(--ink);font-size:13px;-webkit-font-smoothing:antialiased}
.bb{font-family:'Bebas Neue',Impact,sans-serif;font-weight:400;letter-spacing:1px}
.tn{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:linear-gradient(180deg,var(--navy),var(--deep));color:#fff;padding:20px 14px;display:flex;flex-direction:column;position:sticky;top:0;height:100vh}
.side img{height:34px;margin:2px 8px 22px;align-self:flex-start}
.nav{display:flex;flex-direction:column;gap:3px}
.nav a{display:flex;align-items:center;gap:11px;padding:10px 13px;border-radius:11px;color:#AFC4EE;font-size:12.5px;font-weight:600;text-decoration:none;cursor:pointer}
.nav a.on{background:rgba(255,255,255,.13);color:#fff}
.nav a:hover{background:rgba(255,255,255,.07);color:#fff}
.nav .ic{width:17px;text-align:center;font-size:14px}
.side .sp{flex:1}
.who{background:rgba(255,255,255,.08);border-radius:12px;padding:10px 12px;font-size:11px}
.who b{display:block;font-size:12px}
.who .rol{color:#8FB4F0;font-size:9.5px;letter-spacing:1px;font-weight:700}
.demo{margin-top:8px;font-size:9.5px;color:#FFD34D;font-weight:700;letter-spacing:.5px}
.main{padding:22px 30px 60px;max-width:1180px}
.head{display:flex;align-items:center;gap:16px;margin-bottom:20px;flex-wrap:wrap}
.head h2{font-size:26px}
.head small{color:var(--mut);font-weight:600}
.btn{border:0;background:var(--red);color:#fff;border-radius:11px;padding:9px 16px;font-family:Inter;font-weight:700;font-size:12px;cursor:pointer}
.btn.sec{background:#EDF0F6;color:var(--navy)}
.card{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(16,28,61,.05),0 8px 24px -14px rgba(16,28,61,.13);padding:16px 18px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.k{font-size:9px;font-weight:800;letter-spacing:1.8px;color:var(--mut);text-transform:uppercase;margin-bottom:10px}
.kan{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.kcol{background:#EEF1F6;border-radius:16px;padding:12px}
.kcol .k{margin-bottom:8px;display:flex;justify-content:space-between}
.tk{background:#fff;border-radius:12px;padding:11px 13px;margin-bottom:9px;box-shadow:0 1px 3px rgba(16,28,61,.08)}
.tk .t{font-weight:700;font-size:12.5px;line-height:1.35}
.tk .m{display:flex;gap:8px;align-items:center;margin-top:7px;font-size:10px;color:var(--mut);font-weight:600;flex-wrap:wrap}
.avt{width:20px;height:20px;border-radius:50%;background:var(--navy);color:#fff;font-size:9px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.pill{border-radius:99px;padding:2px 9px;font-size:9px;font-weight:800;letter-spacing:.5px}
.pcli{background:#EEF3FB;color:var(--navy)}
.pfx{background:#FDECEC;color:#A60A1B}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.cal .dh{font-size:9px;font-weight:800;letter-spacing:1px;color:var(--mut);text-align:center;padding:4px}
.cd{background:#fff;border:1px solid var(--hair);border-radius:11px;min-height:86px;padding:6px 7px;font-size:10px}
.cd.off{background:transparent;border-color:transparent}
.cd.hoy{border:2px solid var(--sky)}
.cd .n{font-weight:800;font-size:10.5px;color:var(--mut)}
.ev{background:#EEF3FB;border-left:3px solid var(--navy);border-radius:6px;padding:2px 6px;margin-top:4px;font-weight:600;font-size:9.5px;cursor:pointer;line-height:1.3}
.ev.mio{border-left-color:var(--red)}
.li{display:flex;gap:10px;align-items:flex-start;padding:9px 4px;border-bottom:1px solid #F1F3F8}
.li:last-child{border:0}
.chk{width:17px;height:17px;border:2px solid #C9D2E4;border-radius:6px;flex:0 0 17px;cursor:pointer;display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:900;margin-top:1px}
.chk.on{background:var(--ok);border-color:var(--ok)}
input,select,textarea{border:1.5px solid var(--hair);border-radius:10px;padding:9px 12px;font-family:Inter;font-size:12.5px;outline:none;background:#fff;width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--sky)}
label{font-size:10px;font-weight:800;letter-spacing:1px;color:var(--mut);display:block;margin:10px 0 5px}
.ovl{position:fixed;inset:0;background:rgba(7,18,44,.5);display:none;align-items:center;justify-content:center;z-index:50}
.ovl.on{display:flex}
.mod{background:#fff;border-radius:18px;padding:22px 24px;width:430px;max-width:92vw;max-height:88vh;overflow:auto}
.mod h3{font-size:16px;margin-bottom:4px}
.x{float:right;cursor:pointer;color:var(--mut);font-size:16px;font-weight:700}
.cliTabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:16px}
.cliTabs span{background:#fff;border:1px solid var(--hair);border-radius:99px;padding:6px 14px;font-size:11px;font-weight:700;color:var(--mut);cursor:pointer}
.cliTabs span.on{background:var(--navy);border-color:var(--navy);color:#fff}
.file{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #F1F3F8;font-size:12px}
.file .fx{width:30px;height:30px;border-radius:9px;background:#EEF3FB;display:flex;align-items:center;justify-content:center;font-size:13px}
.del{color:#C9D2E4;cursor:pointer;font-weight:800}
.del:hover{color:var(--red)}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:relative;height:auto}}
/* ===== APPLE-GRADE ===== */
.card{border-radius:20px;padding:22px 24px;box-shadow:0 1px 2px rgba(16,28,61,.04),0 12px 32px -18px rgba(16,28,61,.18);border:1px solid rgba(16,28,61,.05);transition:transform .18s,box-shadow .18s}
a .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(16,28,61,.05),0 20px 44px -18px rgba(16,28,61,.24)}
.eyebrow{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:16px}
.eyebrow b{font-size:10px;font-weight:800;letter-spacing:2.2px;color:var(--navy)}
.eyebrow span{font-size:9.5px;font-weight:700;letter-spacing:1px;color:#A7B1C6}
.bignum{font-weight:800;letter-spacing:-1.5px;color:#0E1A38;font-variant-numeric:tabular-nums}
.pbar{height:6px;border-radius:99px;background:#EEF1F6;overflow:hidden}
.pbar i{display:block;height:100%;border-radius:99px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.statl{font-size:9px;font-weight:700;letter-spacing:1.6px;color:#A7B1C6;text-transform:uppercase}
.tinyrow{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-bottom:1px solid #F3F5F9;font-size:12px}
.tinyrow:last-child{border:0}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:7px;vertical-align:1px}
.linkrow{display:flex;gap:26px;margin-top:20px}
.linkrow a{font-size:12px;font-weight:700;color:var(--navy);text-decoration:none}
.linkrow a:hover{color:var(--red)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
#main>*{animation:rise .45s cubic-bezier(.2,.8,.2,1) both}
#main>*:nth-child(2){animation-delay:.05s}#main>*:nth-child(3){animation-delay:.1s}

/* ===== chat (inbox 3 paneles) ===== */
.chatwrap{display:flex;padding:0;overflow:hidden;height:calc(100vh - 170px);min-height:460px}
.cxlist{width:265px;flex:none;border-right:1px solid var(--hair);overflow-y:auto;background:#FAFBFD}
.cxtop{display:flex;gap:7px;padding:12px 10px;position:sticky;top:0;background:#FAFBFD;z-index:2}
.cxtop input{flex:1;border:1px solid var(--hair);border-radius:10px;padding:8px 11px;font-family:Inter;font-size:12px;outline:none}
.cvi{display:flex;align-items:center;gap:10px;padding:10px 12px;cursor:pointer;border-left:3px solid transparent}
.cvi:hover{background:#F0F3F9}
.cvi.on{background:#fff;border-left-color:var(--red);box-shadow:inset 0 -1px 0 var(--hair)}
.cva{width:38px;height:38px;border-radius:50%;background:linear-gradient(135deg,var(--navy),#21299D);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;flex:none}
.cva.grp{background:linear-gradient(135deg,#E00206,#A60A1B)}
.cvt{flex:1;min-width:0}
.cvt b{display:block;font-size:12.5px}
.cvt small{color:var(--mut);font-size:10.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.cvm{text-align:right;font-size:9px;color:var(--mut);display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.cvm i{font-style:normal;background:var(--red);color:#fff;font-size:9px;font-weight:800;border-radius:99px;padding:1.5px 6px}
.chatmain{flex:1;min-width:0;display:flex;flex-direction:column}
.chathead{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px solid var(--hair)}
.chathead b{font-size:13.5px}
.msgs{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:8px;background:#FDFDFE}
.msep{text-align:center;margin:6px 0}
.msep span{background:#EEF2F9;border-radius:99px;padding:3px 12px;font-size:9.5px;font-weight:700;color:var(--mut)}
.msg{display:flex}.msg.mio{justify-content:flex-end}
.burb{max-width:64%;background:#EEF2F9;border-radius:13px 13px 13px 4px;padding:8px 12px;font-size:12.5px;line-height:1.45}
.msg.mio .burb{background:var(--navy);color:#fff;border-radius:13px 13px 4px 13px}
.burb .qn{display:block;font-size:10px;color:var(--red);margin-bottom:2px}
.burb small{display:block;font-size:9px;color:var(--mut);margin-top:3px;text-align:right}
.msg.mio .burb small{color:#AFC4EE}
.burb .mx{cursor:pointer;color:inherit;opacity:.6}
.madj{display:inline-flex;gap:6px;align-items:center;font-weight:700;color:inherit;text-decoration:underline}
.chatvacio{color:var(--mut);font-size:12px;text-align:center;padding:30px 10px}
.composer{display:flex;gap:9px;padding:12px 14px;border-top:1px solid var(--hair);align-items:center}
.composer input#txtMsg{flex:1;border:1px solid var(--hair);border-radius:11px;padding:10px 14px;font-family:Inter;font-size:12.5px;outline:none}
.composer input#txtMsg:focus{border-color:var(--sky)}
.clip{cursor:pointer;font-size:16px;padding:4px}
.cxinfo{width:250px;flex:none;border-left:1px solid var(--hair);overflow-y:auto;padding:14px 14px;background:#FAFBFD}
.ipsec{padding-bottom:13px;margin-bottom:13px;border-bottom:1px solid var(--hair)}
.ipsec:last-child{border:0}
.iptit{font-size:9px;font-weight:800;letter-spacing:1.1px;color:var(--mut);margin-bottom:7px}
.ipl{display:flex;justify-content:space-between;gap:8px;padding:4px 0;font-size:11.5px;color:var(--ink);text-decoration:none}
.ipl span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ipl b{font-size:11px;flex:none}
@media (max-width:1150px){.cxinfo{display:none}}
/* ===== reuniones ===== */
.salas{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
.sala{text-align:center;padding:22px 16px}
.salaic{font-size:30px;margin-bottom:8px}
.sala b{display:block;font-size:14px}
.sala small{color:var(--mut);display:block;margin:4px 0 12px}
.salabtns{display:flex;gap:8px;justify-content:center}
.jitsi{width:100%;height:calc(100vh - 190px);min-height:480px;border:0;border-radius:12px}
.dato-l{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--hair);font-size:12px}
.dato-l:last-child{border:0}.dato-l small{color:var(--mut)}
</style></head><body>

<script>
/* ================== CONFIG ================== */
const ADMIN_EMAILS=['canalmoderno@alimentosbarcelona.com'];
const EQUIPO=[
 {n:'Santiago',e:'canalmoderno@alimentosbarcelona.com',p:'Gerente Canal Moderno'},
 {n:'Franz Ascoli',e:'cuentasclaves@alimentosbarcelona.com',p:'Key Account Manager',carnet:'1689 48443 0101'},
 {n:'Karoline',e:'karoline@alimentosbarcelona.com',p:'Asistente Canal Moderno'},
 {n:'Asistente Inst/Gub',e:'instituciones@alimentosbarcelona.com',p:'Asistente CM Instituciones y Gubernamentales'},
 {n:'Asistente Junior',e:'asistentejr@alimentosbarcelona.com',p:'Asistente Canal Moderno Junior'}
];
const CLIENTES=['WALMART','PAIZ','DESPENSA FAMILIAR','MAXI DESPENSA','GTA','UNISUPER','LA BODEGONA','EL GRAN GALLO','INSTITUCIONES','OTROS'];
/* ================== DATOS (demo local; nube después) ================== */
let NUBE=false, USER=null;
const LSK='centro_cm_v1';
function _db(){try{return JSON.parse(localStorage.getItem(LSK)||'{}')}catch(e){return{}}}
function _sv(d){localStorage.setItem(LSK,JSON.stringify(d))}
function col(c){const d=_db();return d[c]||[]}
function add(c,obj){const d=_db();obj.id=Date.now()+''+Math.floor(Math.random()*999);obj.creado=new Date().toISOString();obj.por=USER.e;(d[c]=d[c]||[]).push(obj);_sv(d);render();}
function upd(c,id,ch){const d=_db();const it=(d[c]||[]).find(x=>x.id===id);if(it)Object.assign(it,ch);_sv(d);render();}
function del(c,id){if(!esAdmin()){alert('Solo Santiago puede eliminar.');return;}const d=_db();d[c]=(d[c]||[]).filter(x=>x.id!==id);_sv(d);render();}
function esAdmin(){return USER&&ADMIN_EMAILS.includes(USER.e);}
USER={n:localStorage.getItem('centro_user_n')||'Santiago',e:localStorage.getItem('centro_user_e')||ADMIN_EMAILS[0]};
function setUser(i){const u=EQUIPO[i];USER={n:u.n,e:u.e};localStorage.setItem('centro_user_n',u.n);localStorage.setItem('centro_user_e',u.e);render();}
let VIEW='inicio';
const VIEWS=[['inicio','🏠','Inicio'],['chat','💬','Chat del equipo'],['reunion','🎥','Reuniones'],['tareas','✅','Tareas del equipo'],['clientes','🏬','Clientes'],['cal','📅','Calendario'],['archivos','☁️','Archivos'],['mio','🔒','Mi espacio'],['datos','📊','Mis dashboards']];
const ini=s=>s.split(' ').map(x=>x[0]).join('').slice(0,2).toUpperCase();
const fmtF=s=>{const d=new Date(s);return d.toLocaleDateString('es-GT',{day:'numeric',month:'short'})};
function vInicio(){
  const mias=col('tareas').filter(t=>t.asig===USER.e&&t.est!=='done');
  const eqp=col('tareas').filter(t=>t.est!=='done');
  const evs=col('eventos').filter(e=>new Date(e.f+'T23:59')>=new Date()).sort((a,b)=>a.f<b.f?-1:1).slice(0,5);
  const acts=[...col('tareas'),...col('archivos'),...col('eventos'),...col('notas')].sort((a,b)=>b.creado<a.creado?-1:1).slice(0,6);
  const R=window.RESUMEN;
  const dia=R?`<div class="card" style="margin-bottom:14px;border-left:5px solid var(--navy);display:flex;gap:26px;align-items:center;flex-wrap:wrap">
    <div><div class="k" style="margin-bottom:3px">Entregado S${R.tras.w}</div><span class="bb tn" style="font-size:26px;color:${R.tras.cump>=95&&R.tras.cump<=110?'var(--ok)':'var(--red)'}">${R.tras.cump}%</span></div>
    <div><div class="k" style="margin-bottom:3px">Me deben</div><span class="bb tn" style="font-size:26px;color:#A60A1B">${fmt2(R.tras.deben)}</span></div>
    <div><div class="k" style="margin-bottom:3px">Listas p/ vender</div><span class="bb tn" style="font-size:26px;color:var(--navy)">${fmt2(R.inv.desp)}</span></div>
    <div><div class="k" style="margin-bottom:3px">Por quebrar</div><span class="bb tn" style="font-size:26px;color:var(--red)">${R.inv.quiebres}</span></div>
    <div><div class="k" style="margin-bottom:3px">Fecha corta</div><span class="bb tn" style="font-size:26px;color:#9A6A00">${fmt2(R.inv.fc)}</span></div>
    <span style="flex:1"></span><a href="index.html" class="btn sec" style="text-decoration:none">Abrir Fill Rate →</a>
  </div>`:'';
  return `<div class="head"><h2 class="bb">CENTRO DE CONTROL</h2><small>${new Date().toLocaleDateString('es-GT',{weekday:'long',day:'numeric',month:'long'})}</small></div>
  ${dia}
  <div class="grid3" style="margin-bottom:14px">
    <div class="card"><div class="k">Mis tareas pendientes</div><div class="bb tn" style="font-size:38px;color:var(--navy)">${mias.length}</div></div>
    <div class="card"><div class="k">Tareas abiertas del equipo</div><div class="bb tn" style="font-size:38px;color:var(--red)">${eqp.length}</div></div>
    <div class="card"><div class="k">Próximos eventos</div><div class="bb tn" style="font-size:38px;color:var(--sky)">${evs.length}</div></div>
  </div>
  <div class="grid2">
    <div class="card"><div class="k">Agenda próxima</div>${evs.map(e=>`<div class="li"><span>📅</span><div><b>${e.t}</b><div style="font-size:10.5px;color:var(--mut)">${fmtF(e.f)}${e.cli?' · '+e.cli:''} · ${e.porN||''}</div></div></div>`).join('')||'<span style="color:var(--mut)">Sin eventos próximos.</span>'}</div>
    <div class="card"><div class="k">Actividad reciente</div>${acts.map(a=>`<div class="li"><span class="avt">${ini(a.porN||'?')}</span><div style="font-size:12px"><b>${a.t||a.nom||''}</b><div style="font-size:10px;color:var(--mut)">${a.porN||''} · ${fmtF(a.creado)}</div></div></div>`).join('')||'<span style="color:var(--mut)">Aún no hay actividad.</span>'}</div>
  </div>`;}
function vTareas(){
  const cols=[['todo','POR HACER'],['doing','EN CURSO'],['done','TERMINADAS']];
  return `<div class="head"><h2 class="bb">TAREAS DEL EQUIPO</h2><small>el equipo avanza y termina · solo Santiago crea y elimina</small>
    ${esAdmin()?'<span style="flex:1"></span><button class="btn" onclick="mTarea()">+ Nueva tarea</button>':''}</div>
  <div class="kan">${cols.map(([k,n])=>{
    const ts=col('tareas').filter(t=>t.est===k);
    return `<div class="kcol"><div class="k">${n}<span>${ts.length}</span></div>${ts.map(t=>`
      <div class="tk"><div class="t">${t.t}</div>
        ${t.d?`<div style="font-size:11px;color:var(--mut);margin-top:4px">${t.d}</div>`:''}
        <div class="m"><span class="avt" title="${(EQUIPO.find(u=>u.e===t.asig)||{}).n||''}">${ini((EQUIPO.find(u=>u.e===t.asig)||{}).n||'?')}</span>
          ${t.cli?`<span class="pill pcli">${t.cli}</span>`:''}
          ${t.fx?`<span class="pill pfx">📆 ${fmtF(t.fx)}</span>`:''}</div>
        <div style="display:flex;gap:6px;margin-top:9px">
          ${k!=='todo'?`<button class="btn sec" style="padding:4px 10px;font-size:10px" onclick="upd('tareas','${t.id}',{est:'${k==='done'?'doing':'todo'}'})">←</button>`:''}
          ${k!=='done'?`<button class="btn sec" style="padding:4px 10px;font-size:10px" onclick="upd('tareas','${t.id}',{est:'${k==='todo'?'doing':'done'}'})">${k==='todo'?'Empezar':'Terminar ✓'}</button>`:''}
          ${esAdmin()?`<span class="del" style="margin-left:auto" onclick="del('tareas','${t.id}')">✕</span>`:''}</div>
      </div>`).join('')}</div>`;}).join('')}</div>`;}
function mTarea(){
  mod(`<span class="x" onclick="cerrar()">✕</span><h3>Nueva tarea</h3>
  <label>Título</label><input id="tt">
  <label>Detalle (opcional)</label><textarea id="td" rows="2"></textarea>
  <label>Asignar a</label><select id="ta">${EQUIPO.map(u=>`<option value="${u.e}">${u.n}</option>`).join('')}</select>
  <label>Cliente (opcional)</label><select id="tc"><option value="">—</option>${CLIENTES.map(c=>`<option>${c}</option>`).join('')}</select>
  <label>Fecha límite (opcional)</label><input id="tf" type="date">
  <button class="btn" style="margin-top:14px;width:100%" onclick="add('tareas',{t:document.getElementById('tt').value||'Tarea',d:document.getElementById('td').value,asig:document.getElementById('ta').value,cli:document.getElementById('tc').value,fx:document.getElementById('tf').value,est:'todo',porN:USER.n});cerrar()">Crear tarea</button>`);}
function vClientes(){
  window.CLI=window.CLI||CLIENTES[0];

let CANAL=null, BUSQ='';
const dmId=(a,b)=>'dm:'+[a,b].sort().join('|');
const LRK=()=>'centro_leidos_'+USER.e;
const _lr=()=>{try{return JSON.parse(localStorage.getItem(LRK())||'{}')}catch(e){return{}}};
function marcarLeido(c){const m=_lr();m[c]=new Date().toISOString();localStorage.setItem(LRK(),JSON.stringify(m));}
const msgsDe=c=>col('chat').filter(m=>m.canal===c);
const noLeidos=c=>{const lr=_lr()[c]||'';return msgsDe(c).filter(m=>m.creado>lr&&m.por!==USER.e).length;};

function convs(){
  const ds=EQUIPO.filter(u=>u.e!==USER.e).map(u=>({id:dmId(USER.e,u.e),tipo:'dm',nombre:u.n,sub:u.p||'',u}));
  const gs=col('grupos').filter(g=>(g.miembros||[]).includes(USER.e)).map(g=>({id:'grp:'+g.id,tipo:'grp',nombre:g.nombre,sub:(g.miembros||[]).length+' integrantes',g}));
  const all=[...ds,...gs].map(c=>{const ms=msgsDe(c.id);c.ult=ms[ms.length-1]||null;c.nl=noLeidos(c.id);return c;});
  all.sort((a,b)=>((b.ult&&b.ult.creado)||'').localeCompare((a.ult&&a.ult.creado)||''));
  return all.filter(c=>!BUSQ||c.nombre.toLowerCase().includes(BUSQ.toLowerCase()));
}

      <div><b>${act.nombre}</b><small style="display:block;color:var(--mut)">${act.sub}</small></div>
      <div style="margin-left:auto;display:flex;gap:7px">
        <button class="btn sec" title="Videollamada" onclick="VIEW='reunion';abrirSala('sala-rapida','Sala Rápida')">🎥</button>
        ${act.tipo==='grp'&&esAdmin()?`<button class="btn sec" title="Eliminar grupo" onclick="borrarGrupo('${act.g.id}')">🗑</button>`:''}
      </div>`;
    comp=`<div class="composer">
      <label class="clip" title="Adjuntar archivo">📎<input type="file" style="display:none" onchange="adjuntar(this)"></label>
      <input id="txtMsg" placeholder="Escribe un mensaje…" onkeydown="if(event.key==='Enter')enviarMsg()">
      <button class="btn" onclick="enviarMsg()">Enviar</button></div>`;
  }
  // ---- columna 3: panel de información ----
  let info='';
  if(act&&act.tipo==='dm'){
    const u=act.u;
    const ts=col('tareas').filter(t=>t.asig===u.e&&t.est!=='done').slice(0,4);
    const adjs=msgsDe(act.id).filter(m=>m.adj).slice(-5).reverse();
    info=`<div class="ipsec" style="text-align:center;padding-top:6px">
      <span class="cva" style="width:52px;height:52px;font-size:17px;margin:0 auto 8px">${ini(u.n)}</span>
      <b style="font-size:14px;display:block">${u.n}</b>
      <small style="color:var(--mut)">${u.p||''}</small>
      <div style="color:var(--ok);font-size:10.5px;font-weight:700;margin-top:5px">● Disponible</div></div>
    <div class="ipsec"><div class="iptit">INFORMACIÓN</div>
      <div class="ipl"><span>Correo</span><b style="font-size:10px">${u.e}</b></div>
      <div class="ipl"><span>Puesto</span><b>${u.p||'—'}</b></div></div>
    <div class="ipsec"><div class="iptit">TAREAS PENDIENTES (${ts.length})</div>
      ${ts.map(t=>`<div class="ipl"><span>✅ ${t.t}</span><b>${t.fx?fmtF(t.fx):''}</b></div>`).join('')||'<small style="color:var(--mut)">Sin tareas pendientes</small>'}
      <a style="font-size:10.5px;font-weight:700;color:var(--red);cursor:pointer" onclick="VIEW='tareas';render()">Ver tareas →</a></div>
    <div class="ipsec"><div class="iptit">ARCHIVOS DEL CHAT</div>
      ${adjs.map(m=>`<a class="ipl" href="${m.adj.b64}" download="${m.adj.n}" style="cursor:pointer"><span>📎 ${m.adj.n.slice(0,22)}</span><b>${Math.round(m.adj.s/1024)}K</b></a>`).join('')||'<small style="color:var(--mut)">Sin archivos compartidos</small>'}</div>`;
  } else if(act&&act.tipo==='grp'){
    const adjs=msgsDe(act.id).filter(m=>m.adj).slice(-5).reverse();
    info=`<div class="ipsec" style="text-align:center;padding-top:6px">
      <span class="cva grp" style="width:52px;height:52px;font-size:20px;margin:0 auto 8px">👥</span>
      <b style="font-size:14px;display:block">${act.nombre}</b><small style="color:var(--mut)">Grupo del equipo</small></div>
    <div class="ipsec"><div class="iptit">INTEGRANTES (${act.g.miembros.length})</div>
      ${act.g.miembros.map(e=>{const u=EQUIPO.find(x=>x.e===e);return `<div class="ipl"><span>${ini(nombreDe(e))} ${nombreDe(e)}</span><b style="font-size:9.5px;color:var(--mut)">${u?u.p||'':''}</b></div>`;}).join('')}</div>
    <div class="ipsec"><div class="iptit">ARCHIVOS DEL GRUPO</div>
      ${adjs.map(m=>`<a class="ipl" href="${m.adj.b64}" download="${m.adj.n}" style="cursor:pointer"><span>📎 ${m.adj.n.slice(0,22)}</span><b>${Math.round(m.adj.s/1024)}K</b></a>`).join('')||'<small style="color:var(--mut)">Sin archivos</small>'}</div>`;
  }
  return `<div class="head"><h2 class="bb">CHAT DEL EQUIPO</h2><small>${NUBE?'en la nube':'demo local — con la nube será en tiempo real'}</small></div>
  <div class="chatwrap card">
    <div class="cxlist">
      <div class="cxtop"><input placeholder="🔍 Buscar…" value="${BUSQ}" oninput="BUSQ=this.value;render();this.focus();this.setSelectionRange(this.value.length,this.value.length)">
        <button class="btn" style="padding:7px 10px" title="Nuevo grupo" onclick="crearGrupoModal()">＋</button></div>
      ${lista}
    </div>
    <div class="chatmain">
      <div class="chathead">${cab}</div>
      <div class="msgs" id="msgs">${hilo}</div>
      ${comp}
    </div>
    <div class="cxinfo">${info}</div>
  </div>`;
}
/* ================== REUNIONES (Jitsi Meet embebido) ================== */
let SALA=null;
const SALAS=[
 ['reunion-jueves-pp','Reunión Jueves · PP','Jueves 9:00–10:30 con Planificación'],
 ['daily-canal-moderno','Daily Canal Moderno','Arranque rápido del día'],
 ['sala-rapida','Sala Rápida','Para lo que surja ahora mismo']];
const urlSala=id=>'https://meet.jit.si/BarcelonaCM-'+id;
function abrirSala(id,nombre){SALA={id,nombre};add('reuniones',{sala:nombre,porN:USER.n});}
function cerrarSala(){SALA=null;render();}
function copiarSala(id){navigator.clipboard.writeText(urlSala(id)).then(()=>alert('Link de la sala copiado — mándalo por chat o correo.'));}
function vReunion(){
  if(SALA){
    return `<div class="head"><h2 class="bb">🎥 ${SALA.nombre.toUpperCase()}</h2>
      <button class="btn sec" onclick="copiarSala('${SALA.id}')">Copiar link</button>
      <button class="btn" style="margin-left:auto" onclick="cerrarSala()">Salir de la sala</button></div>
    <div class="card" style="padding:6px">
      <iframe class="jitsi" src="${urlSala(SALA.id)}#userInfo.displayName=%22${encodeURIComponent(USER.n)}%22&config.prejoinConfig.enabled=false"
        allow="camera; microphone; fullscreen; display-capture; autoplay"></iframe>
    </div>`;
  }
  const hist=col('reuniones').slice(-6).reverse().map(r=>
    `<div class="dato-l"><span>🎥 ${r.sala}</span><small>${r.porN} · ${fmtF(r.creado)} ${new Date(r.creado).toLocaleTimeString('es-GT',{hour:'2-digit',minute:'2-digit'})}</small></div>`).join('')
    || '<div class="chatvacio">Aún no hay reuniones iniciadas.</div>';
  return `<div class="head"><h2 class="bb">REUNIONES</h2><small>videollamadas del equipo — sin cuentas ni instalación (Jitsi)</small></div>
  <div class="salas">
    ${SALAS.map(([id,n,d])=>`<div class="card sala">
      <div class="salaic">🎥</div><b>${n}</b><small>${d}</small>
      <div class="salabtns">
        <button class="btn" onclick="abrirSala('${id}','${n}')">Entrar</button>
        <button class="btn sec" onclick="copiarSala('${id}')">Copiar link</button>
      </div></div>`).join('')}
  </div>
  <div class="card" style="margin-top:16px"><b style="font-size:13px">Últimas reuniones</b><div style="margin-top:8px">${hist}</div></div>`;
}

function render(){
  document.getElementById('nav').innerHTML=VIEWS.map(([k,i,n])=>`<a class="${VIEW===k?'on':''}" onclick="VIEW='${k}';render()"><span class="ic">${i}</span>${n}</a>`).join('');
  document.getElementById('who').innerHTML=`<b>${USER.n}</b><span class="rol">${esAdmin()?'ADMINISTRADOR':'EQUIPO'}</span>
   <select style="margin-top:7px;padding:5px 8px;font-size:10.5px" onchange="setUser(this.value)">${EQUIPO.map((u,i)=>`<option value="${i}" ${u.e===USER.e?'selected':''}>${u.n}</option>`).join('')}</select>`;
  document.getElementById('modo').textContent=NUBE?'':'● MODO DEMO — datos locales de prueba';
  const v={inicio:vInicio,chat:vChat,reunion:vReunion,tareas:vTareas,clientes:vClientes,cal:vCal,archivos:vArchivos,mio:vMio,datos:vDatos}[VIEW];
  document.getElementById('main').innerHTML=v();
  const _m=document.getElementById('msgs'); if(_m) _m.scrollTop=_m.scrollHeight;
}
render();
</script>
